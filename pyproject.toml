[project]
name = "vrheaven-promobot"
version = "0.1.0"
description = "Telegram-бот учёта партнёрской программы: заказы по промокодам, комиссии, выплаты"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.29",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
